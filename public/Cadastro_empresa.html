<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Empresa | ParkVision</title>

    <script src="./js/sessao.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./CSS/cadastro_empresa.css">
    <link rel="shortcut icon" href="../Assets/Icons/icon-ParkVision.png" type="image/x-icon">
    <link rel="icon" href="Assets/Icons/tagFoto.png">
</head>

<body onload="listar()">

    <div class="container">
        <div class="conteudo">

            <div class="titulo">Cadastro de Empresas Parceiras</div>

            <div class="alerta_erro">
                <div class="card_erro" id="cardErro">
                </div>
            </div>

            <div class="formulario">

                <div class="campo campo-inteiro">
                    <div class="rotulo">Nome Fantasia:</div>
                    <input type="text" placeholder="Digite o nome Fantasia" id="ipt_nome_fantasia">
                </div>

                <div class="campo">
                    <div class="rotulo">CNPJ:</div>
                    <input type="text" inputmode="numeric" maxlength="14" placeholder="Digite o seu cnpj" id="ipt_cnpj"
                        onkeyup="validar_cnpj()">
                    <div id="validacao_cnpj"></div>

                </div>
                <div class="campo">
                    <div class="rotulo">Código de validação da empresa:</div>
                    <input type="text" placeholder="Digite o código" id="ipt_codigo_validacao">
                </div>

                <div class="campo campo-inteiro">
                    <div class="campo campo-inteiro">
                        <div class="rotulo">Razão Social:</div>
                        <input type="text" placeholder="Razão Social" id="ipt_razao_social">
                    </div>

                    <button type="button" class="btn-finalizar" onclick="cadastrar()"> Cadastrar </button>
                    <span id="mensagem_erro"></span>

                </div>

                <div id="div_aguardar" class="loading-div">
                    <img src="./assets/circle-loading.gif" id="loading-gif">
                </div>
                <div id="div_erros_login"></div>
            </div>
        </div>

        <script>

            let listaEmpresasCadastradas = [];

            function validar_cnpj() {

                let cnpj = ipt_cnpj.value;

                if (cnpj == '') {

                    validacao_cnpj.innerHTML = '';

                } else if (cnpj.length < 14 || cnpj.length > 14) {

                    validacao_cnpj.innerHTML =
                        `<p style="color: #be2424;">
                        cnpj inválido - ${cnpj.length} dígito(s)
                    </p>`;

                } else {

                    validacao_cnpj.innerHTML = '';

                }

            }

            function cadastrar() {

                aguardar();

                let cnpj = ipt_cnpj.value;
                let codigo_validacao = ipt_codigo_validacao.value;
                let nome_fantasia = ipt_nome_fantasia.value;
                let razao_social = ipt_razao_social.value;
                let idEmpresaVincular;


                if (
                    nome_fantasia == "" ||
                    cnpj == "" ||
                    codigo_validacao == "" ||
                    razao_social == ""
                ) {

                    cardErro.style.display = "block";

                    mensagem_erro.innerHTML =
                        "Preencha todos os campos para continuar.";

                    finalizarAguardar();

                    return false;

                } else {

                    setInterval(sumirMensagem, 5000);

                }

                if (cnpj.length != 14) {

                    cardErro.style.display = "block";

                    mensagem_erro.innerHTML =
                        "CNPJ inválido. Digite os 14 números.";

                    finalizarAguardar();

                    return false;
                }

                // Enviando os dados para a API
                console.log("NOME DA EMPRESA:", nome_empresa);

                console.log("CNPJ:", cnpj);

                fetch("/usuarios/cadastrar", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        nomeEmpresaServer: nome_empresa,
                        cnpjServer: cnpj,
                        razaoSocialServer: razao_social,
                        idEmpresaVincularServer: idEmpresaVincular,
                        codigoValidacaoServer: codigo_validacao
                    })

                })

                    .then(function (resposta) {

                        console.log("resposta: ", resposta);

                        if (resposta.ok) {

                            cardErro.style.display = "block";

                            mensagem_erro.innerHTML =
                                "Cadastro realizado com sucesso!";

                            limparFormulario();
                            finalizarAguardar();

                        } else {

                            resposta.text().then(texto => {

                                console.error(texto);

                                mensagem_erro.innerHTML =
                                    "Houve um erro ao tentar realizar o cadastro.";

                                cardErro.style.display = "block";

                                finalizarAguardar();

                            });

                        }

                    })

                    .catch(function (erro) {

                        console.log("#ERRO:", erro);

                        finalizarAguardar();

                    });

                return false;

            }

            function limparFormulario() {

                ipt_nome_empresa.value = "";
                ipt_cnpj.value = "";
                ipt_codigo_validacao.value = "";
                validar.innerHTML = "";
                validacao_cnpj.innerHTML = "";
            }

            function sumirMensagem() {

                cardErro.style.display = "none";

            }

        </script>

</body>

</html>
