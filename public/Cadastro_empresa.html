<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Empresa | ParkVision</title>

    <script src="./js/sessao.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./CSS/cadastro_empresa.css">
    <link rel="shortcut icon" href="../Assets/Icons/icon-ParkVision.png" type="image/x-icon">
    <link rel="icon" href="Assets/Icons/tagFoto.png">
</head>

<body>

    <div class="container">
        <div class="conteudo">

            <div class="titulo">Cadastro de Empresas Parceiras</div>

            <div class="alerta_erro">
                <div class="card_erro" id="cardErro">
                </div>
            </div>

            <div class="formulario">

                <div class="campo campo-inteiro">
                    <div class="rotulo">Nome Fantasia:</div>
                    <input type="text" placeholder="Digite o nome Fantasia" id="ipt_nome_fantasia">
                </div>

                <div class="campo">
                    <div class="rotulo">CNPJ:</div>
                    <input type="text" inputmode="numeric" maxlength="14" placeholder="Digite o seu cnpj" id="ipt_cnpj"
                        onkeyup="validar_cnpj()">
                    <div id="validacao_cnpj"></div>

                </div>
                <div class="campo">
                    <div class="rotulo">Código de validação da empresa:</div>
                    <input type="text" placeholder="Digite o código" id="ipt_codigo_validacao">
                </div>

                <div class="campo campo-inteiro">
                    <div class="campo campo-inteiro">
                        <div class="rotulo">Razão Social:</div>
                        <input type="text" placeholder="Razão Social" id="ipt_razao_social">
                    </div>

                    <button type="button" class="btn-finalizar" onclick="cadastrar()"> Cadastrar </button>
                    <span id="mensagem_erro"></span>

                </div>
                
                <div id="div_erros_login"></div>
            </div>
        </div>

       <script>
    function validar_cnpj() {
        let cnpj = ipt_cnpj.value;

        if (cnpj == '') {
            validacao_cnpj.innerHTML = '';
        } else if (cnpj.length != 14) {
            validacao_cnpj.innerHTML =
                `<p style="color: #be2424;">cnpj inválido - ${cnpj.length} dígito(s)</p>`;
        } else {
            validacao_cnpj.innerHTML = '';
        }
    }

    function cadastrar() {
        let nome_fantasia = ipt_nome_fantasia.value.trim();
        let cnpj = ipt_cnpj.value.trim();
        let codigo_validacao = ipt_codigo_validacao.value.trim();
        let razao_social = ipt_razao_social.value.trim();

        if (nome_fantasia == "" || cnpj == "" || codigo_validacao == "" || razao_social == "") {
            mostrarMensagem("Preencha todos os campos para continuar.");
            return false;
        }

        if (cnpj.length != 14 || isNaN(cnpj)) {
            mostrarMensagem("CNPJ inválido. Digite os 14 números.");
            return false;
        }

        if (codigo_validacao.length != 5) {
            mostrarMensagem("O código de validação deve ter 5 caracteres.");
            return false;
        }

        fetch("/cadastroEmpresa/cadastrar", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                nomeFantasiaServer: nome_fantasia,
                cnpjServer: cnpj,
                codigoValidacaoServer: codigo_validacao,
                razaoSocialServer: razao_social
            })
        })
            .then(function (resposta) {
                if (resposta.ok) {
                    mostrarMensagem("Cadastro realizado com sucesso!", true);
                    limparFormulario();
                } else {
                    resposta.text().then(texto => {
                        console.error(texto);
                        mostrarMensagem("Houve um erro ao tentar realizar o cadastro.");
                    });
                }
            })
            .catch(function (erro) {
                console.log("#ERRO:", erro);
                mostrarMensagem("Não foi possível conectar ao servidor.");
            });

        return false;
    }

    function mostrarMensagem(texto, sucesso) {
    cardErro.style.display = "block";
    mensagem_erro.innerHTML = texto;

    if (sucesso) {
        mensagem_erro.className = "sucesso";
    } else {
        mensagem_erro.className = "erro";
    }

    setTimeout(sumirMensagem, 5000);
}function mostrarMensagem(texto, sucesso) {
    cardErro.style.display = "block";
    mensagem_erro.innerHTML = texto;

    if (sucesso) {
        mensagem_erro.className = "sucesso";
    } else {
        mensagem_erro.className = "erro";
    }

    setTimeout(sumirMensagem, 5000);
}

    function limparFormulario() {
        ipt_nome_fantasia.value = "";
        ipt_cnpj.value = "";
        ipt_codigo_validacao.value = "";
        ipt_razao_social.value = "";
        validacao_cnpj.innerHTML = "";
    }

    function sumirMensagem() {
        cardErro.style.display = "none";
    }
</script>
</html>
