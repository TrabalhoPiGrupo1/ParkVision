
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ParkVision</title>

    <script src="./js/sessao.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./CSS/style_cadastro_login.css">
    <link rel="stylesheet" href="./CSS/style_login.css">
    <link rel="shortcut icon" href="./Assets/Icons/tagFoto.png" type="image/x-icon">
</head>

<body>

    <div class="container">

        <div class="lado-esquerdo">
            <img class="foto" src="./Assets/Images/Imagem_login.jpg" alt="Estacionamento">
            <img class="degrade" src="./Assets/Images/degrade.png" alt="">
            <img class="logo" src="./Assets/Icons/logo_amarelo.png" alt="ParkVision">
        </div>

        <div class="lado-direito">

            <div class="topo">

                <div class="abas">
                    <div class="aba">
                        <a href="./cadastro_usuario.html">Cadastro</a>
                    </div>

                    <div class="aba aba-ativa">
                        <a href="#">Login</a>
                    </div>
                </div>

                <div class="btn-voltar">
                    <a href="./index.html">Voltar</a>
                </div>

            </div>

            <div class="titulo">
                Que bom ter você de volta! <br>
                Para acessar sua conta,

                <div class="titulo-destaque">
                    Faça o Login.
                </div>
            </div>

            <!-- Mensagem de erro -->

            <div class="formulario">

                <div class="campo campo-inteiro">
                    <div class="rotulo">E-mail:</div>
                    <input
                        type="text"
                        placeholder="Digite o seu e-mail"
                        id="ipt_email">
                </div>

                <div class="campo campo-inteiro">
                    <div class="rotulo">Senha:</div>
                    <input
                        type="password"
                        placeholder="Digite a sua senha"
                        id="ipt_senha">
                </div>

                <button class="btn-finalizar" onclick="entrar()">Login</button>

                 <div class="alerta_erro">
                <div class="card_erro" id="cardErro">
                    <span id="mensagem_erro"></span>
                </div>
            </div>

            </div>

            <div id="div_aguardar" class="loading-div"></div>

            <div id="div_erros_login"></div>

        </div>

    </div>

    <script>

        function entrar() {

            aguardar();

            var emailVar = ipt_email.value;
            var senhaVar = ipt_senha.value;

            if (emailVar == "" || senhaVar == "") {

                cardErro.style.display = "block";

                mensagem_erro.innerHTML =
                    "Preencha todos os campos para continuar.";

                finalizarAguardar();

                return false;

            } else {

                setInterval(sumirMensagem, 5000);

            }

            console.log("FORM EMAIL: ", emailVar);
            console.log("FORM SENHA: ", senhaVar);

            fetch("/usuarios/autenticar", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    emailServer: emailVar,
                    senhaServer: senhaVar

                })

            }).then(function (resposta) {

                console.log("ESTOU NO THEN DO entrar()!");

                if (resposta.ok) {

                    console.log(resposta);

                    resposta.json().then(json => {

                        console.log(json);

                        sessionStorage.EMAIL_USUARIO = json.email;
                        sessionStorage.NOME_USUARIO = json.nome;
                        sessionStorage.ID_USUARIO = json.id;
                        sessionStorage.AQUARIOS = JSON.stringify(json.aquarios);

                        setTimeout(function () {

                            window.location = "./Dashboard_HTML/estacionamentos_acesso.html";

                        }, 1000);

                    });

                } else {

                    console.log("Houve um erro ao tentar realizar o login!");

                    resposta.text().then(texto => {

                        console.error(texto);

                        finalizarAguardar(texto);

                    });

                }

            }).catch(function (erro) {

                console.log(erro);

                finalizarAguardar();

            });

            return false;

        }

        function sumirMensagem() {

            cardErro.style.display = "none";

        }

    </script>

</body>

</html>
