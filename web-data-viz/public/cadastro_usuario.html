<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | ParkVision</title>

    <script src="./js/sessao.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./CSS/style_cadastro_login.css">
    <link rel="shortcut icon" href="../Assets/Icons/icon-ParkVision.png" type="image/x-icon">
    <link rel="icon" href="Assets/Icons/tagFoto.png">
</head>

<body>

    <div class="container">

        <div class="lado-esquerdo">
            <img class="foto" src="./Assets/Images/cadastro.png" alt="Estacionamento">
            <img class="degrade" src="./Assets/Images/degrade.png" alt="">
            <img class="logo" src="./Assets/Icons/logo_amarelo.png" alt="ParkVision">
        </div>

        <div class="lado-direito">

            <div class="topo">

                <div class="abas">

                    <div class="aba aba-ativa">
                        <a href="./cadastro_usuario.html">Cadastro</a>
                    </div>

                    <div class="aba">
                        <a href="./login.html">Login</a>
                    </div>

                </div>

                <a href="./site_institucional.html">
                    <div class="btn-voltar">Voltar</div>
                </a>

            </div>

            <div class="titulo">
                Não é nosso Cliente ainda?

                <div class="titulo-destaque">
                    Cadastre-se.
                </div>
            </div>

            <!-- Mensagens de erro -->
            <div class="alerta_erro">
                <div class="card_erro" id="cardErro">
                </div>
            </div>

            <div class="formulario">

                <div class="campo campo-inteiro">

                    <div class="rotulo">Nome completo:</div>

                    <input type="text" placeholder="Digite seu nome completo" id="ipt_nome_usuario">

                </div>

                <div class="campo">

                    <div class="rotulo">CPF:</div>

                    <input type="text" inputmode="numeric" maxlength="14" placeholder="Digite o seu CPF" id="ipt_cpf"
                        onkeyup="validar_cpf()">

                    <div id="validacao_cpf"></div>

                </div>

                <div class="campo">

                    <div class="rotulo">Código de validação da empresa:</div>

                    <input type="text" placeholder="Digite o código" id="ipt_codigo_validacao">

                </div>

                <div class="campo">

                    <div class="rotulo">E-mail:</div>

                    <input type="text" placeholder="Digite o seu e-mail" id="ipt_email">

                </div>

                <div class="campo">

                    <div class="rotulo">Cargo:</div>

                    <select id="ipt_cargo">
                        <option value="1">Gerente</option>
                        <option value="2">Supervisor</option>
                        <option value="3">Analista</option>
                    </select>


                </div>

                <div class="campo campo-inteiro">

                    <div class="rotulo">Senha:</div>

                    <input type="password" placeholder="Digite uma senha" id="ipt_senha" onkeyup="validar_seguranca()">

                    <div id="validar"></div>

                </div>

                <div class="campo campo-inteiro">

                    <div class="rotulo">Confirme sua senha:</div>

                    <input type="password" placeholder="Digite novamente sua senha" id="ipt_confirma_senha"
                        onkeyup="validar_confirmacao()">

                    <div id="confirmacao_senha"></div>

                </div>

                <button type="button" class="btn-finalizar" onclick="cadastrar()">Cadastrar</button>
                <span id="mensagem_erro"></span>


            </div>

            <!-- Loading -->
            <div id="div_aguardar" class="loading-div">

                <img src="./assets/circle-loading.gif" id="loading-gif">

            </div>

            <div id="div_erros_login"></div>

        </div>

    </div>

    <script>

        let listaEmpresasCadastradas = [];
        let requisitos_cadastro_global = 0;


        function validar_seguranca() {

            let requisitos_cadastro = 0;
            let senha = ipt_senha.value;
            let criterios = 1;

            if (senha.length >= 8) {
                criterios += 1;
            }

            if (senha.length >= 10) {
                criterios += 1;
            }

            if (senha.toUpperCase() !== senha) {
                criterios += 1;
            }

            if (senha.toLowerCase() !== senha) {
                criterios += 1;
            }

            if (senha == '') {

                validar.innerHTML = '';
                requisitos_cadastro = 0;

            } else if (criterios == 5) {

                validar.innerHTML =
                    `<p style="color: #3aad16;">Senha Forte</p>`;

                requisitos_cadastro = 2;

            } else if (criterios == 4) {

                validar.innerHTML =
                    `<p style="color: #c79e0a;">Senha Média</p>`;

                requisitos_cadastro = 1;

            } else if (criterios <= 3) {

                validar.innerHTML =
                    `<p style="color: #be2424;">Senha Fraca</p>`;

                requisitos_cadastro = 0;

            }

            requisitos_cadastro_global = requisitos_cadastro;

        }

        function validar_cpf() {

            let cpf = ipt_cpf.value;
            if (cpf == '') {

                validacao_cpf.innerHTML = '';

            } else if (cpf.length < 11 || cpf.length > 11) {

                validacao_cpf.innerHTML =
                    `<p style="color: #be2424;">
                        cpf inválido - ${cpf.length} dígito(s)
                    </p>`;

            } else {

                validacao_cpf.innerHTML = '';

            }

        }

        function cadastrar() {

            aguardar();

            let email = ipt_email.value;
            let senha = ipt_senha.value;
            let confirma_senha = ipt_confirma_senha.value;
            let cpf = ipt_cpf.value;
            let codigo_validacao = ipt_codigo_validacao.value;
            let nome_usuario = ipt_nome_usuario.value;
            let fk_cargo = ipt_cargo.value;

            if (
                nome_usuario == "" ||
                cpf == "" ||
                codigo_validacao == "" ||
                senha == "" ||
                confirma_senha == "" ||
                email == ""
            ) {

                cardErro.style.display = "block";

                mensagem_erro.innerHTML =
                    "Preencha todos os campos para continuar.";

                finalizarAguardar();

                return false;

            } else {

                setInterval(sumirMensagem, 5000);

            }

            if (cpf.length != 11) {

                cardErro.style.display = "block";

                mensagem_erro.innerHTML =
                    "cpf inválido. Digite os 11 números.";

                finalizarAguardar();

                return false;

            }

            let codigoValido = true;

            if (codigoValido == false) {

                cardErro.style.display = "block";

                mensagem_erro.innerHTML =
                    "Código de validação inválido.";

                finalizarAguardar();

                return false;

            }

            if (confirma_senha !== senha) {

                confirmacao_senha.innerHTML =
                    `<p style="color: #be2424;">
                        As senhas informadas não são iguais!
                        Tente novamente.
                    </p>`;

                finalizarAguardar();

                return false;

            }

            if (requisitos_cadastro_global < 1) {

                confirmacao_senha.innerHTML =
                    `<p style="color: #be2424;">
                        Sua senha está muito fraca. Crie outra!
                    </p>`;

                finalizarAguardar();

                return false;

            }

            // Enviando os dados para a API
            console.log("NOME DO USUÁRIO:", nome_usuario);

            console.log("cpf:", cpf);

            fetch("/usuarios/cadastrar", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    nomeServer: nome_usuario,
                    id_cargoServer: fk_cargo,
                    emailServer: email,
                    senhaServer: senha,
                    cpfServer: cpf,
                    codigo_validacaoServer: codigo_validacao

                })

            })

                .then(function (resposta) {

                    console.log("resposta: ", resposta);

                    if (resposta.ok) {

                        cardErro.style.display = "block";

                        mensagem_erro.innerHTML =
                            "Cadastro realizado com sucesso! Redirecionando para o Login...";

                        setTimeout(() => {

                            window.location = "login.html";

                        }, 2000);

                        limparFormulario();

                        finalizarAguardar();

                    } else {

                        resposta.text().then(texto => {

                            console.error(texto);

                            mensagem_erro.innerHTML = texto;

                            cardErro.style.display = "block";

                            finalizarAguardar();

                        });

                    }

                })

                .catch(function (erro) {

                    console.log("#ERRO:", erro);

                    finalizarAguardar();

                });

            return false;

        }

        function listar() {

            fetch("/empresas/listar", {

                method: "GET"

            })

                .then(function (resposta) {

                    resposta.json().then((empresas) => {

                        empresas.forEach((empresa) => {

                            listaEmpresasCadastradas.push(empresa);

                            console.log("listaEmpresasCadastradas");

                            console.log(
                                listaEmpresasCadastradas[0].codigo_ativacao
                            );

                        });

                    });

                })

                .catch(function (resposta) {

                    console.log("#ERRO:", resposta);

                });

        }

        function limparFormulario() {

            ipt_nome_usuario.value = "";
            ipt_cpf.value = "";
            ipt_codigo_validacao.value = "";
            ipt_senha.value = "";
            ipt_confirma_senha.value = "";
            validar.innerHTML = "";
            validacao_cpf.innerHTML = "";
            confirmacao_senha.innerHTML = "";
            requisitos_cadastro_global = 0;

        }

        function validar_confirmacao() {

            let confirma_senha = ipt_confirma_senha.value;

            if (confirma_senha == "") {

                confirmacao_senha.innerHTML = "";

            }

        }

        function sumirMensagem() {

            cardErro.style.display = "none";

        }

    </script>

</body>

</html>
