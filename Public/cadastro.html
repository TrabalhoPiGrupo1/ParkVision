<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | ParkVision</title>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./CSS/style_cadastro_login.css">
    <link rel="shortcut icon" href="../Assets/Icons/icon-ParkVision.png" type="image/x-icon">

</head>

<body>

    <div class="container">
        <div class="lado-esquerdo">
            <img class="foto" src="./Assets/Images/cadastro.png" alt="estacionamento">
            <img class="degrade" src="./Assets/Images/degrade.png" alt="">
            <img class="logo" src="./Assets/Icons/logo_amarelo.png" alt="ParkVision">
        </div>

        <div class="lado-direito">
            <div class="topo">
                <div class="abas">
                    <div class="aba aba-ativa"><a href="./cadastro.html">Cadastro</a></div>
                    <div class="aba"><a href="./login.html  ">Login</a></div>
                </div>
                <a href="./site_institucional.html">
                    <div class="btn-voltar">Voltar</div>
                </a>
            </div>

            <div class="titulo">
                Não é nosso Cliente ainda?
                <div class="titulo-destaque">Cadastre-se.</div>
            </div>

            <div class="formulario">
                <div class="campo campo-inteiro">
                    <div class="rotulo">Nome da empresa:</div>
                    <input type="text" placeholder="Digite o nome da Empresa" id="ipt_nome_empresa">
                </div>

                <div class="campo">
                    <div class="rotulo">CNPJ:</div>
                    <input type="number" placeholder="Digite o CNPJ" id="ipt_cnpj" onkeyup="validar_cnpj()">
                    <div class="" id="validacao_cnpj"></div>
                </div>

                <div class="campo">
                    <div class="rotulo">Código de validação:</div>
                    <input type="text" placeholder="Digite o código" id="ipt_codigo_validacao">
                </div>

                <div class="campo campo-inteiro">
                    <div class="rotulo">Senha:</div>
                    <input type="password" placeholder="Digite uma senha" id="ipt_senha" onkeyup="validar_seguranca()">
                    <div class="" id="validar"></div>
                </div>

                <div class="campo campo-inteiro">
                    <div class="rotulo">Confirme sua senha:</div>
                    <input type="password" placeholder="Digite novamente sua senha" id="ipt_confirma_senha"
                        onkeyup="validar_confirmacao()">
                    <div class="" id="confirmacao_senha"></div>
                </div>

                <div class="btn-finalizar" onclick="cadastrar()"><a href="#">Cadastrar</a></div>

            </div>
        </div>
    </div>
</body>

<!-- Validação de Senhas -->
<script>
    let requisitos_cadastro_global = 0;

    function validar_seguranca() {
        let requisitos_cadastro = 0;
        let senha = ipt_senha.value;
        let criterios = 1;

        if (senha.length >= 8) {
            criterios += 1
        }
        if (senha.length >= 10) {
            criterios += 1
        }
        if (senha.toUpperCase() !== senha) {
            criterios += 1
        }
        if (senha.toLowerCase() !== senha) {
            criterios += 1
        }
        if (senha == '') {
            validar.innerHTML = ''
            requisitos_cadastro = 0;
        } else if (criterios == 5) {
            validar.innerHTML = `<p style = "color: #3aad16;">Senha Forte</p>`
            requisitos_cadastro = 2;
        } else if (criterios == 4) {
            validar.innerHTML = `<p style = "color: #c79e0a;">Senha Média</p>`
            requisitos_cadastro = 1;
        } else if (criterios <= 3) {
            validar.innerHTML = `<p style = "color: #be2424;">Senha Fraca</p>`
            requisitos_cadastro = 0;
        }

        requisitos_cadastro_global = requisitos_cadastro;
    };

    function validar_cnpj() {
        let cnpj = ipt_cnpj.value;

        if (cnpj == '') {
            validacao_cnpj.innerHTML = ''
        } else if (cnpj.length < 14 || cnpj.length > 14) {
            validacao_cnpj.innerHTML = `<p style = "color: #be2424;"> CNPJ inválido - ${cnpj.length} dígito(s)</p>`
        } else {
            validacao_cnpj.innerHTML = ''
        }
    }

    function cadastrar() {
        let senha = ipt_senha.value;
        let confirma_senha = ipt_confirma_senha.value;
        let cnpj = ipt_cnpj.value;
        let codigo_validacao = ipt_codigo_validacao.value;
        let nome_empresa = ipt_nome_empresa.value;

        if (nome_empresa == "") {
            alert('Preencha o campo nome!')
        } else if (cnpj == "") {
            alert('Preencha o campo cnpj!')
        } else if (codigo_validacao == "") {
            alert('Preencha o código de validação!')
        } else if (senha == "") {
            alert('Crie uma senha!')
        }

        else {
            if ((confirma_senha == senha) && requisitos_cadastro_global >= 1) {
                confirmacao_senha.innerHTML = `<p style = "color: #3aad16; font-size: 16px; font-weight: 600;">Usuário cadastrado com sucesso!</p>`
            } else if (confirma_senha !== senha) {
                confirmacao_senha.innerHTML = `<p style = "color: #be2424;">As senhas informadas não são iguais! Tente novamente</p>`
            } else {
                confirmacao_senha.innerHTML = `<p style = "color: #be2424;"> Sua senha atual é muito fraca. Crie outra! </p>`
            }
        }
    }
    function validar_confirmacao() {
        let confirma_senha = ipt_confirma_senha.value;

        if (confirma_senha == "") {
            confirmacao_senha.innerHTML = "";
        }
    };
</script>

</script>

</html>
