<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="estilo_login.css">
</head>

<body>
    <div class="comeco">

        <!-- COLUNA ESQUERDA: imagem -->
        <div class="lado_imagem">
            <img src="f4996ee2d3fd63cf82b8882a46a6ce4627444628.jpg" alt="">
        <img class="logo" src="40d95c42e2f8181c154043972d2568378b25c994.png" alt="">
        </div>

        <!-- COLUNA DIREITA: conteúdo -->
        <div class="lado_conteudo">

            <div class="bt">
                <div class="bt_esquerda">
                    <button class="bt_cadastro">CADASTRO</button>
                </div>
                <button class="bt_voltar">VOLTAR</button>
            </div>

            <div class="titulo">
                <h1>
                    Que bom ter você de volta! Para <br>
                    acessar sua conta, <br>
                    <span>Faça o Login.</span>
                </h1>
            </div>

            <div class="formulario">
                <div class="campo">
                    <span>CNPJ</span>
                    <input type="text" placeholder="Digite seu CNPJ" id="ipt_cnpj">
                </div>

                <div class="campo">
                    <span>Senha:</span>
                    <input type="password" placeholder="Digite sua senha" id="ipt_senha">
                </div>

                <button class="bt_login">LOGIN</button>
            </div>

        </div>
    </div>
</body>

</html>
