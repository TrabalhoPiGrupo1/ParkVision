<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ParkVision</title>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../Tela_Cadastro/style.css"> 
</head>

<body>

    <div class="container">

        <div class="lado-esquerdo">
            <img class="foto" src="../Assets/estacionamento.png" alt="estacionamento">
            <img class="degrade" src="../Assets/Rectangle2.png" alt="">
            <img class="logo" src="../Assets/Rectangle3.png" alt="ParkVision">
        </div>

        <div class="lado-direito">

            <div class="topo">
                <div class="abas">
                    <div class="aba">Cadastro</div>
                    <div class="aba aba-ativa">Login</div>
                </div>
                <div class="btn-voltar">Voltar</div>
            </div>

            <div class="titulo">
                Que bom ter você de volta! <br>
                Para acessar sua conta,
                <div class="titulo-destaque">Faça o Login.</div>
            </div>

            <div class="formulario">

                <div class="campo campo-inteiro">
                    <div class="rotulo">CNPJ:</div>
                    <input type="text" placeholder="Digite o seu CNPJ" id="ipt_cnpj">
                </div>

                <div class="campo campo-inteiro">
                    <div class="rotulo">Senha:</div>
                    <input type="password" placeholder="Digite a sua senha" id="ipt_senha">
                </div>

                <div class="campo campo-inteiro">
                    <div class="rotulo">Código de validação:</div>
                    <input type="password" placeholder="Digite o código" id="ipt_codigo">
                </div>

                <div class="btn-finalizar">Login</div>

            </div>

        </div>

    </div>

</body>

</html>
