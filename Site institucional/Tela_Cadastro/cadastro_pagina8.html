<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | ParkVision</title>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="lado-esquerdo">
            <img class="foto" src="img/estacionamento.png" alt="estacionamento">
            <img class="degrade" src="img/Rectangle2.png" alt="">
            <img class="logo" src="img/Rectangle3.png" alt="ParkVision">
        </div>

        <div class="lado-direito">

            <div class="topo">
                <div class="abas">
                    <div class="aba aba-ativa">Cadastro</div>
                    <div class="aba">Login</div>
                </div>
                <div class="btn-voltar">Voltar</div>
            </div>

            <div class="titulo">
                Não é nosso Cliente ainda?
                <div class="titulo-destaque">Cadastre-se.</div>
            </div>
            <div class="formulario">

                <div class="campo">
                    <div class="rotulo">Nome da empresa:</div>
                    <input type="text" placeholder="Digite o nome da Empresa">
                </div>

                <div class="campo">
                    <div class="rotulo">CNPJ:</div>
                    <input type="text" placeholder="Digite o CNPJ">
                </div>

                <div class="campo campo-inteiro">
                    <div class="rotulo">Senha:</div>
                    <input type="password" placeholder="Digite uma senha">
                </div>

                <div class="campo campo-inteiro">
                    <div class="rotulo">Confirme sua senha:</div>
                    <input type="password" placeholder="Digite novamente sua senha">
                </div>

                <div class="btn-cadastrar">Cadastrar</div>

            </div>

        </div>

    </div>

</body>

</html>
